services:
  app:
    build: ./docker/php
    container_name: waco-app
    ports:
      - "8008:80"
    volumes:
      - .:/var/www/html
      # vendor/ de tren o dia CUA CONTAINER, khong doc qua thu muc chia se voi
      # Windows. Doc mot file qua thu muc chia se cham hon khoang 90 lan, ma
      # moi lan mo trang Laravel doc chung 660 file trong vendor - de nguyen
      # thi moi trang mat 8-9 giay, tach ra con chua den mot giay.
      #
      # Doi lai: cai them thu vien thi phai chay TRONG container
      #     docker exec waco-app composer require <ten-goi>
      # roi dong bo ra ngoai cho trinh soan thao doc duoc:
      #     docker cp waco-app:/var/www/html/vendor ./
      - vendor-data:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: waco-db
    ports:
      - "33068:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sql_waco
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db-data:/var/lib/mysql
      # Mount dung file dump cua waco. Khong mount ca folder ../db vi trong do
      # con dump cua project khac, se bi import nham vao database nay.
      - ../db/sql_waco.sql:/docker-entrypoint-initdb.d/01-waco.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  phpmyadmin:
    image: phpmyadmin:5
    container_name: waco-pma
    ports:
      - "8088:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 256M
    depends_on:
      - db

volumes:
  db-data:
  vendor-data:
